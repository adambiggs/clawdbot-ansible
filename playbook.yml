---
- name: Install Clawdbot in Docker Sandbox
  hosts: localhost
  connection: local

  vars:
    ansible_python_interpreter: /usr/bin/python3

  environment:
    TERM: xterm-256color
    COLORTERM: truecolor
    PATH: "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

  pre_tasks:
    - name: Detect operating system
      ansible.builtin.set_fact:
        is_macos: "{{ ansible_facts['os_family'] == 'Darwin' }}"
        is_linux: "{{ ansible_facts['os_family'] == 'Debian' }}"
        is_debian: "{{ ansible_facts['distribution'] in ['Debian', 'Ubuntu'] }}"
        is_redhat: "{{ ansible_facts['os_family'] == 'RedHat' }}"

    - name: Display detected OS
      ansible.builtin.debug:
        msg: |
          Detected OS: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
          OS Family: {{ ansible_facts['os_family'] }}
          macOS: {{ is_macos }}

    - name: Verify macOS requirement
      ansible.builtin.fail:
        msg: |
          This playbook requires macOS with Docker Desktop.
          Docker Sandbox is a Docker Desktop feature and is not available on Linux.
      when: not is_macos

    - name: Install Ansible collections
      ansible.builtin.command: ansible-galaxy collection install -r requirements.yml
      args:
        chdir: "{{ playbook_dir }}"
      delegate_to: localhost
      run_once: true
      changed_when: false

  roles:
    - clawdbot

  post_tasks:
    - name: Copy ASCII art script
      ansible.builtin.copy:
        src: roles/clawdbot/files/show-lobster.sh
        dest: /tmp/show-lobster.sh
        mode: '0755'

    - name: Display ASCII art
      ansible.builtin.command: /tmp/show-lobster.sh
      changed_when: false

    - name: Notify that playbook is complete
      ansible.builtin.debug:
        msg: "Clawdbot installation complete!"
