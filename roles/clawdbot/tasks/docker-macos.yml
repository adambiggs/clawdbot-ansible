---
# macOS-specific Docker installation (Docker Desktop)
# Using direct DMG/pkg download avoids Homebrew cask sudo issues

- name: Check if Docker Desktop is installed (macOS)
  ansible.builtin.stat:
    path: /Applications/Docker.app
  register: docker_desktop

- name: Get macOS architecture
  ansible.builtin.command: uname -m
  register: macos_arch
  changed_when: false
  when: not docker_desktop.stat.exists

- name: Download Docker Desktop DMG (macOS)
  become: true
  ansible.builtin.get_url:
    url: "https://desktop.docker.com/mac/main/{{ 'arm64' if macos_arch.stdout == 'arm64' else 'amd64' }}/Docker.dmg"
    dest: /tmp/Docker.dmg
    mode: '0644'
  when: not docker_desktop.stat.exists

- name: Mount Docker DMG and install (macOS)
  become: true
  ansible.builtin.shell: |
    hdiutil attach /tmp/Docker.dmg -nobrowse -quiet
    cp -R "/Volumes/Docker/Docker.app" /Applications/
    hdiutil detach "/Volumes/Docker" -quiet
    rm -f /tmp/Docker.dmg
  args:
    creates: /Applications/Docker.app
  when: not docker_desktop.stat.exists

- name: Wait for Docker Desktop to be available (macOS)
  ansible.builtin.wait_for:
    path: /var/run/docker.sock
    timeout: 120
  when: not docker_desktop.stat.exists

- name: Display Docker Desktop installation note (macOS)
  ansible.builtin.debug:
    msg: |
      ℹ️  Docker Desktop installed on macOS.
      Please ensure Docker Desktop is running and has been configured.
      You may need to start it manually from Applications.
  when: not docker_desktop.stat.exists

- name: Verify Docker is accessible
  ansible.builtin.command: docker --version
  register: docker_version
  changed_when: false
  failed_when: false

- name: Display Docker version
  ansible.builtin.debug:
    msg: "Docker installed: {{ docker_version.stdout }}"
  when: docker_version.rc == 0
