---
# macOS-specific Tailscale installation (Standalone pkg - recommended by Tailscale)
# Using the standalone pkg instead of Homebrew cask avoids sudo issues and is
# the recommended installation method per https://tailscale.com/kb/1065/macos-variants

- name: Check if Tailscale is already installed (macOS)
  ansible.builtin.stat:
    path: /Applications/Tailscale.app
  register: tailscale_app_macos

- name: Download and install Tailscale pkg (macOS)
  become: true
  ansible.builtin.shell: |
    curl -fsSL -o /tmp/Tailscale.pkg https://pkgs.tailscale.com/stable/Tailscale-latest-macos.pkg
    installer -pkg /tmp/Tailscale.pkg -target /
    rm -f /tmp/Tailscale.pkg
  args:
    creates: /Applications/Tailscale.app
  when: not tailscale_app_macos.stat.exists

- name: Check if Tailscale daemon is running (macOS)
  ansible.builtin.shell: pgrep -x Tailscale || pgrep -f 'Tailscale.app'
  register: tailscale_daemon_check
  changed_when: false
  failed_when: false

- name: Set Tailscale running status (macOS)
  ansible.builtin.set_fact:
    tailscale_running_macos: "{{ tailscale_daemon_check.rc == 0 }}"

- name: Display Tailscale setup instructions (macOS)
  ansible.builtin.debug:
    msg:
      - "============================================"
      - "Tailscale installed on macOS"
      - "============================================"
      - ""
      - "To connect this Mac to your Tailnet:"
      - ""
      - "Option 1 - GUI:"
      - "  1. Open Tailscale from Applications"
      - "  2. Click 'Log in' and follow the web flow"
      - ""
      - "Option 2 - CLI:"
      - "  sudo /Applications/Tailscale.app/Contents/MacOS/Tailscale up"
      - ""
      - "With auth key:"
      - "  sudo /Applications/Tailscale.app/Contents/MacOS/Tailscale up --authkey tskey-auth-xxxxx"
      - ""
      - "Get auth key from: https://login.tailscale.com/admin/settings/keys"
  when: not tailscale_running_macos
