---
# macOS-specific Node.js installation (Homebrew-based)
# Uses clawdbot's Homebrew at /opt/clawdbot with bottle relocation enabled

- name: Install Node.js via Homebrew (macOS)
  community.general.homebrew:
    name: node
    state: present
    path: "{{ clawdbot_homebrew_bin }}"
  become: true
  become_user: "{{ clawdbot_user }}"
  environment:
    HOME: "{{ clawdbot_home }}"
    HOMEBREW_RELOCATE_BUILD_PREFIX: "1"

- name: Install pnpm via Homebrew (macOS)
  community.general.homebrew:
    name: pnpm
    state: present
    path: "{{ clawdbot_homebrew_bin }}"
  become: true
  become_user: "{{ clawdbot_user }}"
  environment:
    HOME: "{{ clawdbot_home }}"
    HOMEBREW_RELOCATE_BUILD_PREFIX: "1"
