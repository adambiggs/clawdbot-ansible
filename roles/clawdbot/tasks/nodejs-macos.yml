---
# macOS-specific Node.js installation (Homebrew-based)
# Homebrew refuses to run as root, so we must become the user who owns it

- name: Install Node.js via Homebrew (macOS)
  community.general.homebrew:
    name: node
    state: present
  become: true
  become_user: "{{ homebrew_owner }}"

- name: Install pnpm via Homebrew (macOS)
  community.general.homebrew:
    name: pnpm
    state: present
  become: true
  become_user: "{{ homebrew_owner }}"
