---
# Main Node.js orchestration - delegates to OS-specific tasks

- name: Include Linux Node.js installation
  ansible.builtin.include_tasks: nodejs-linux.yml
  when: ansible_facts['os_family'] == 'Debian'

- name: Include macOS Node.js installation
  ansible.builtin.include_tasks: nodejs-macos.yml
  when: ansible_facts['os_family'] == 'Darwin'

- name: Display unsupported OS warning
  ansible.builtin.fail:
    msg: "Unsupported OS family: {{ ansible_facts['os_family'] }}. Only Debian/Ubuntu and macOS are supported."
  when: ansible_facts['os_family'] not in ['Debian', 'Darwin']

# Common verification tasks for all operating systems

- name: Verify Node.js installation
  ansible.builtin.command: node --version
  register: node_version
  changed_when: false

- name: Verify pnpm installation
  ansible.builtin.command: pnpm --version
  register: pnpm_version
  changed_when: false

- name: Display Node.js and pnpm versions
  ansible.builtin.debug:
    msg:
      - "Node.js version: {{ node_version.stdout }}"
      - "pnpm version: {{ pnpm_version.stdout }}"
