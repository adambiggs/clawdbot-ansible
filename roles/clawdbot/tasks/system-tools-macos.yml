---
# macOS-specific system tools installation (Homebrew-based)
# Uses clawdbot's Homebrew at /opt/clawdbot with bottle relocation enabled

- name: Install essential system tools (macOS - clawdbot's Homebrew)
  community.general.homebrew:
    name:
      # Shells
      - zsh
      # Editors
      - vim
      - nano
      # Version control
      - git
      - git-lfs
      # Network tools
      - curl
      - wget
      - netcat
      - nmap
      - socat
      - telnet
      # Debugging tools
      - htop
      # System utilities
      - tmux
      - tree
      - jq
      - unzip
      - rsync
    state: present
    path: "{{ clawdbot_homebrew_bin }}"
  become: true
  become_user: "{{ clawdbot_user }}"
  environment:
    HOME: "{{ clawdbot_home }}"
    HOMEBREW_RELOCATE_BUILD_PREFIX: "1"

- name: Get current user shell (macOS)
  ansible.builtin.command: dscl . -read /Users/{{ clawdbot_user }} UserShell
  register: current_shell
  changed_when: false
  failed_when: false

- name: Set zsh as default shell for clawdbot user (macOS)
  become: true
  ansible.builtin.command: chsh -s /bin/zsh {{ clawdbot_user }}
  when: "'/bin/zsh' not in current_shell.stdout"
  changed_when: true

- name: Configure .zshrc for clawdbot user (macOS)
  become: true
  ansible.builtin.blockinfile:
    path: "{{ clawdbot_home }}/.zshrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - Clawdbot config"
    block: |
      # Security: restrictive default permissions for new files/directories
      umask 077

      # Enable bottle relocation for non-standard Homebrew prefix
      export HOMEBREW_RELOCATE_BUILD_PREFIX=1

      # Enable 256 colors
      export TERM=xterm-256color
      export COLORTERM=truecolor

      # Add clawdbot's Homebrew to PATH (installed at /opt/clawdbot)
      eval "$(/opt/clawdbot/bin/brew shellenv)"

      # pnpm configuration
      export PNPM_HOME="{{ clawdbot_home }}/.local/share/pnpm"

      # Add pnpm and local bin to PATH
      export PATH="{{ clawdbot_home }}/.local/bin:$PNPM_HOME:$PATH"

      # Color support for common tools
      export CLICOLOR=1
      export LSCOLORS=ExFxCxDxBxegedabagacad

      # Aliases
      alias ls='ls -G'
      alias grep='grep --color=auto'
      alias ll='ls -lah'
    create: true
    owner: "{{ clawdbot_user }}"
    mode: '0644'
